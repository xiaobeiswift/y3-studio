[package]
name = "y3-helper"
version = "0.0.1"
edition = "2021"
description = "Standalone Rust implementation of Y3-Helper with multi-project and multi-map concurrent support (no VS Code UI dependency)"
authors = ["不明不惑"]
default-run = "y3-helper"

[[bin]]
name = "y3-helper"
path = "src/main.rs"

[[bin]]
name = "y3-studio-setup"
path = "src/bin/installer.rs"

[lib]
name = "y3_helper"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
ruzstd = "0.7"
calamine = "0.37"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
clap = { version = "4.5", features = ["derive"] }
md-5 = "0.10"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
hex = "0.4"
encoding_rs = "0.8"
regex = "1.11"
walkdir = "2.5"
glob = "0.3"
notify = "6.1"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
parking_lot = "0.12"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.15"

[dev-dependencies]
tempfile = "3.12"

[profile.release]
strip = "symbols"
opt-level = 3
